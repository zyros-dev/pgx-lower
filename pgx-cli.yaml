project: pgx-lower

remote:
  host: comfy
  path: /home/zel/repos/pgx-lower
  mutagen_session: pgx-lower
  docker_container: pgx-lower-dev

queues:
  build: pgx-build
  check: pgx-check

sync:
  required_for_remote: true
  flush_timeout_seconds: 45
  proof:
    enabled: true
    path: .pgx-cli/sync-probes
    required_for:
      - build
      - test
      - lint
      - psql
      - pg_regress
      - bench
      - profile
      - run

output:
  mode: agent
  transcript_dir: .pgx-cli/runs
  max_lines_per_step: 80
  max_lines_total: 180
  failure_tail_lines: 60
  success_tail_lines: 20
  progress: final-summary
  full_output_requires_flag: true

profiles:
  debug:
    build:
      build_dir: build-artifacts/ptest
      cmake:
        generator: Ninja
        args:
          CMAKE_BUILD_TYPE: Debug
          BUILD_ONLY_EXTENSION: true
          CMAKE_EXPORT_COMPILE_COMMANDS: true
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
    runtime:
      analyzer: auto
      fallback: auto
      logging: info
      latency_logging: true
      routing_ledger: true

  latency:
    inherits: debug
    build:
      build_dir: build-artifacts/latency
      cmake:
        args:
          CMAKE_BUILD_TYPE: Release
          CMAKE_CXX_FLAGS_RELEASE: "-O3"
    runtime:
      logging: error
      latency_logging: false
      routing_ledger: false

  force-fallback:
    inherits: debug
    runtime:
      fallback: force
      routing_ledger: true

  force-lower:
    inherits: debug
    runtime:
      fallback: error
      routing_ledger: true
